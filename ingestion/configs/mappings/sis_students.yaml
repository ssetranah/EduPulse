# Mock SIS / REST SIS -> Bronze `sis_students`.
# Shows: renaming, date formats, Y/N flags -> boolean, code translation (value_map),
# sensitivity labels, null handling.
entity: students
bronze_table: sis_students
schema_version: "1.0.0"
description: Student roster (synthetic). Names and birth dates are labeled restricted.
primary_key: [tenant_id, student_id]
incremental_field: source_modified_at
unknown_fields: warn
fields:
  - {source: DistrictId, target: tenant_id, required: true, max_length: 64}
  - {source: SchoolId, target: school_id, required: true, max_length: 64}
  - {source: StudentUniqueId, target: student_id, required: true, max_length: 64, sensitivity: confidential}
  - {source: StateStudentId, target: state_student_id, sensitivity: confidential}
  - {source: FirstName, target: first_name, required: true, sensitivity: restricted}
  - {source: LastSurname, target: last_name, required: true, sensitivity: restricted}
  - source: BirthDate
    target: birth_date
    type: date
    formats: ["%m/%d/%Y"]
    required: true
    sensitivity: restricted
  - {source: GradeLevelDescriptor, target: grade_level, required: true}
  - source: GenderDescriptor
    target: gender
    required: true
    value_map: {F: FEMALE, M: MALE, X: NON_BINARY}
    sensitivity: confidential
  - {source: RaceDescriptor, target: race_ethnicity, sensitivity: confidential}
  - {source: EnglishLearnerFlag, target: english_learner, type: boolean, required: true, sensitivity: confidential}
  - {source: SpecialEducationFlag, target: special_education, type: boolean, required: true, sensitivity: restricted}
  - {source: EconomicDisadvantageFlag, target: economically_disadvantaged, type: boolean, required: true, sensitivity: confidential}
  - {source: EntryDate, target: enrollment_start_date, type: date, formats: ["%m/%d/%Y"], required: true}
  - source: EnrollmentStatus
    target: enrollment_status
    required: true
    case: upper
    allowed_values: [ACTIVE, WITHDRAWN, GRADUATED, TRANSFERRED]
  - {source: SyntheticMarker, target: synthetic_marker, required: true}
  - {source: LastModifiedDate, target: source_modified_at, type: datetime, required: true}
