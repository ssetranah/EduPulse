# EduPulse AI -- local development stack (synthetic data only).
#
#   cp .env.example .env
#   docker compose up --build                       # api + dashboard + MinIO
#   docker compose --profile tools run --rm synth   # generate SYNTHETIC_TEST_DATA into the volume
#   docker compose --profile tools run --rm dbt     # dbt debug against local DuckDB
#   docker compose --profile postgres up            # also start optional PostgreSQL
#
# Local mode uses a DuckDB file in the shared `warehouse` volume. PostgreSQL is optional and is
# reserved for the serving store / row-level-security work in later phases.

name: edupulse

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  api:
    <<: *env
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      EDUPULSE_API_HOST: 0.0.0.0
      EDUPULSE_API_PORT: "8000"
      EDUPULSE_DATA_MODE: ${EDUPULSE_DATA_MODE:-synthetic}
      EDUPULSE_ENV: ${EDUPULSE_ENV:-local}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - warehouse:/data
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the medallion buckets. Exits when done.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-edupulse-bronze}
      SILVER_BUCKET: ${SILVER_BUCKET:-edupulse-silver}
      GOLD_BUCKET: ${GOLD_BUCKET:-edupulse-gold}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$BRONZE_BUCKET local/$$SILVER_BUCKET local/$$GOLD_BUCKET"
    restart: "no"

  # --- optional / on-demand --------------------------------------------------------------
  synth:
    <<: *env
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    entrypoint: ["python", "-m", "ingestion.synthetic"]
    command: ["generate", "--out", "/data/synthetic"]
    volumes:
      - warehouse:/data

  dbt:
    <<: *env
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/dbt.Dockerfile
    environment:
      EDUPULSE_DUCKDB_PATH: ${EDUPULSE_DUCKDB_PATH:-/data/edupulse.duckdb}
    command: ["dbt", "debug"]
    volumes:
      - warehouse:/data

  postgres:
    <<: *env
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edupulse}
      POSTGRES_USER: ${POSTGRES_USER:-edupulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edupulse} -d ${POSTGRES_DB:-edupulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  warehouse:
  minio-data:
  postgres-data:
