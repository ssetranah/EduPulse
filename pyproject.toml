[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edupulse-ai"
version = "0.2.0"
description = "EduPulse AI: a secure, multi-tenant educational data platform for K-12 school networks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Phase 2 adds the two libraries the ingestion framework needs: YAML parsing and config
# validation. Everything else (HTTP, SQLite state, Bronze files) is standard library.
dependencies = [
  "pyyaml>=6",
  "pydantic>=2.6",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.16.9",
  "pre-commit>=3.7",
  "openpyxl>=3.1",
]

[project.scripts]
edupulse-synth = "ingestion.synthetic.cli:main"
edupulse = "ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["ingestion*", "api*", "rag*"]

[tool.setuptools.package-data]
ingestion = ["configs/*.yaml", "configs/mappings/*.yaml"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "evidence/**/sample"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert and hard-coded placeholder values are fine in tests
"tests/**" = ["S101", "S105", "S106", "S311", "PT018"]
# `random` is deliberate here: reproducible fake data, not security-sensitive.
"ingestion/synthetic/**" = ["S311"]
"evidence/**" = ["S603", "S607"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast, isolated tests",
  "integration: exercises several components or a real local process",
  "data_quality: asserts properties of generated/processed data",
]
