# Generated by evidence/phase2.py: the shipped config + deterministic demo faults.
version: 1
storage:
  root: data/ingestion
defaults:
  retry:
    max_attempts: 4
    base_delay_seconds: 0.05
    max_delay_seconds: 30
    multiplier: 2.0
    jitter: true
  quality_gate:
    max_reject_ratio: 0.1
    min_records: 10
sources:
  file_drop_synthetic:
    type: file_drop
    system:
      system: FILE_DROP
      vendor: Synthetic Labs
      product: Nightly extract drop
      description: Phase 1 synthetic extracts
    tenant_id: null
    drop_dir: data/synthetic
    entities:
    - name: students
      mapping: ../../ingestion/configs/mappings/filedrop_students.yaml
      file_pattern: sis/students.csv
      format: csv
    - name: grades
      mapping: ../../ingestion/configs/mappings/filedrop_grades.yaml
      file_pattern: grading/grades.jsonl
      format: jsonl
    - name: assessment_definitions
      mapping: ../../ingestion/configs/mappings/filedrop_assessment_definitions.yaml
      file_pattern: assessment/assessment_definitions.*
      format: auto
  rest_sis_api:
    type: rest_api
    enabled: true
    system:
      system: SIS
      vendor: Mock Vendor
      product: REST SIS API
      version: v1
    base_url: http://127.0.0.1:8765
    auth:
      type: none
    entities:
    - name: students
      mapping: ../../ingestion/configs/mappings/sis_students.yaml
      path: /v1/students
      records_path: data
      since_param: updated_since
      pagination:
        type: page
        page_size: 200
  mock_sis:
    type: mock_sis
    system:
      system: SIS
      vendor: Mock Vendor
      product: Mock SIS
      version: '1.0'
    mock:
      seed: 20260101
      tenants: 2
      schools_per_tenant: 3
      students_per_school: 60
      faults:
        fail_first_n_calls: 1
        bad_row_rate: 0.02
    entities:
    - name: schools
      mapping: ../../ingestion/configs/mappings/sis_schools.yaml
    - name: students
      mapping: ../../ingestion/configs/mappings/sis_students.yaml
  mock_lms:
    type: mock_lms
    system:
      system: LMS
      vendor: Mock Vendor
      product: Mock LMS
      version: '1.0'
    mock:
      seed: 20260101
      tenants: 2
      schools_per_tenant: 3
      students_per_school: 60
      lms_events_per_student: 20
      faults:
        duplicate_row_rate: 0.01
    entities:
    - name: lms_activity
      mapping: ../../ingestion/configs/mappings/lms_activity.yaml
  mock_assessment:
    type: mock_assessment
    system:
      system: ASSESSMENT
      vendor: Mock Vendor
      product: Mock Assessment Platform
      version: '1.0'
    mock:
      seed: 20260101
      tenants: 2
      schools_per_tenant: 3
      students_per_school: 60
    entities:
    - name: assessment_definitions
      mapping: ../../ingestion/configs/mappings/assessment_definitions.yaml
    - name: assessment_results
      mapping: ../../ingestion/configs/mappings/assessment_results.yaml
  mock_attendance:
    type: mock_attendance_intervention
    system:
      system: ATTENDANCE_INTERVENTION
      vendor: Mock Vendor
      product: Mock Attendance & Intervention
      version: '1.0'
    mock:
      seed: 20260101
      tenants: 2
      schools_per_tenant: 3
      students_per_school: 60
      attendance_days: 30
      faults:
        bad_row_rate: 0.005
    entities:
    - name: attendance_daily
      mapping: ../../ingestion/configs/mappings/attendance_daily.yaml
    - name: interventions
      mapping: ../../ingestion/configs/mappings/interventions.yaml
