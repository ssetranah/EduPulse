name: edupulse
version: "0.1.0"
config-version: 2
profile: edupulse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

# Medallion layers. Models arrive in later phases; the layer conventions are fixed now.
models:
  edupulse:
    bronze:
      +materialized: view
      +tags: ["bronze"]
    silver:
      +materialized: table
      +tags: ["silver"]
    gold:
      +materialized: table
      +tags: ["gold"]
