name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m unit
      - name: Integration tests
        run: pytest -m integration
      - name: Data-quality tests
        run: pytest -m data_quality

  synthetic-data-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate synthetic dataset
        run: python -m ingestion.synthetic generate --out "$RUNNER_TEMP/synthetic"
      - name: Validate synthetic dataset
        run: python -m ingestion.synthetic validate "$RUNNER_TEMP/synthetic"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet
      - name: Validate with optional profiles
        run: docker compose --env-file .env.example --profile postgres --profile tools config --quiet
